<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Taximeter Pro</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <style id="expo-reset">
      /* Ionicons TTF font - loaded from CDN so it works in all contexts
         (Replit preview iframe, mobile browser, Firebase hosted web app).
         @expo/vector-icons registers this family as 'Ionicons' at runtime,
         but if the Metro bundler URL is not reachable (e.g. inside an iframe
         on a different origin) the browser falls back to this CDN declaration. */
      @font-face {
        font-family: 'ionicons';
        src: url('https://unpkg.com/@expo/vector-icons@15.0.3/build/vendor/react-native-vector-icons/Fonts/Ionicons.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }

      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <meta name="theme-color" content="#FFD700">
    <meta name="description" content="Professionele ritprijscalculator voor taxichauffeurs. Bereken direct de wettelijke ritprijs op basis van actuele 2026-tarieven.">
    <link rel="icon" href="/favicon.ico" />
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
